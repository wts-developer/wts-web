name: Close Asana tasks on merged PRs

# Completes Asana tasks referenced in a merged PR's description.
# Convention: put "closes <asana task URL>" or "closes <bare task id>"
# (case-insensitive) in the PR body, one per task. Only MERGED PRs
# complete tasks; a PR closed without merging leaves its tasks open.
#
# Needs an ASANA_PAT secret (an Asana personal access token, ideally
# from a service account). Set it once at the wts-developer org level
# and share it with the repos that need it, or per-repo with:
#   gh secret set ASANA_PAT --repo wts-developer/<repo>
#
# This file is deliberately standalone: to enable the same behavior in
# another wts repo, copy it into that repo's .github/workflows/ as is.
# No repo depends on another for this to work.
#
# This is deterministic automation on GitHub-managed runners: no AI in
# the loop, and the only data touched is the Asana task id from the PR
# body and its completion state.

on:
  pull_request:
    types: [closed]

# pull-requests: write lets the job rewrite bare task ids in the PR
# body into clickable Asana links after completing them.
permissions:
  pull-requests: write

jobs:
  close-asana:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Complete referenced Asana tasks
        env:
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import re
          import sys
          import urllib.request

          body = os.environ.get("PR_BODY") or ""
          pat = os.environ.get("ASANA_PAT") or ""
          pr_url = os.environ.get("PR_URL") or ""

          # "closes <asana task URL>": accept any app.asana.com URL and
          # read the task gid as the last long digit run in its path
          # (covers both classic /0/<project>/<task> and newer
          # /1/<workspace>/.../task/<task> URL shapes).
          refs = re.findall(
              r"closes\s+<?(https://app\.asana\.com/[^\s>),]+)",
              body, re.IGNORECASE,
          )
          gids = []
          for url in refs:
              digits = re.findall(r"/(\d{6,})", url)
              if digits:
                  gids.append(digits[-1])
          # "closes <bare task id>": a long digit run works too (Asana
          # gids are 10+ digits, so this can't collide with GitHub's
          # "closes #123" issue references).
          gids += re.findall(r"closes\s+(\d{10,})\b", body, re.IGNORECASE)
          gids = list(dict.fromkeys(gids))

          if not gids:
              print("No 'closes <asana task URL>' references in the PR body; nothing to do.")
              sys.exit(0)
          if not pat:
              print("::error::ASANA_PAT secret is not set but the PR references Asana tasks.")
              sys.exit(1)

          def call(path, payload, method):
              req = urllib.request.Request(
                  f"https://app.asana.com/api/1.0{path}",
                  data=json.dumps({"data": payload}).encode(),
                  headers={
                      "Authorization": f"Bearer {pat}",
                      "Content-Type": "application/json",
                  },
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          # Retroactively turn bare task ids in the PR body into
          # clickable Asana links (URL references already auto-link).
          # Best effort: a failure here never blocks task completion.
          def linkify_body():
              gh_token = os.environ.get("GITHUB_TOKEN") or ""
              repo = os.environ.get("REPO") or ""
              pr_number = os.environ.get("PR_NUMBER") or ""
              if not (gh_token and repo and pr_number):
                  return
              new_body = re.sub(
                  r"(closes\s+)(\d{10,})\b",
                  lambda m: (
                      f"{m.group(1)}[{m.group(2)}]"
                      f"(https://app.asana.com/0/0/{m.group(2)}/f)"
                  ),
                  body, flags=re.IGNORECASE,
              )
              if new_body == body:
                  return
              try:
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/pulls/{pr_number}",
                      data=json.dumps({"body": new_body}).encode(),
                      headers={
                          "Authorization": f"Bearer {gh_token}",
                          "Accept": "application/vnd.github+json",
                          "Content-Type": "application/json",
                      },
                      method="PATCH",
                  )
                  with urllib.request.urlopen(req, timeout=30):
                      pass
                  print("Linked bare Asana task ids in the PR body")
              except Exception as exc:
                  print(f"::warning::Could not linkify the PR body: {exc}")

          linkify_body()

          failures = 0
          for gid in gids:
              try:
                  call(f"/tasks/{gid}", {"completed": True}, "PUT")
                  call(
                      f"/tasks/{gid}/stories",
                      {"text": f"Completed automatically: merged {pr_url}"},
                      "POST",
                  )
                  print(f"Completed Asana task {gid}")
              except Exception as exc:
                  print(f"::error::Could not complete Asana task {gid}: {exc}")
                  failures += 1
          sys.exit(1 if failures else 0)
          PYEOF
