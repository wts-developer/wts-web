name: Close Asana tasks

# Marks Asana tasks referenced as "closes <task URL or bare id>" in a
# merged PR's body complete, sets their Status field, comments the PR
# link, and linkifies bare ids. The logic lives in
# wts-developer/wts-github-hooks; this repo provides the trigger, the
# permissions, and the ASANA_PAT org secret.

on:
  pull_request:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  close:
    uses: wts-developer/wts-github-hooks/.github/workflows/asana-close.yml@main
    secrets:
      ASANA_PAT: ${{ secrets.ASANA_PAT }}
